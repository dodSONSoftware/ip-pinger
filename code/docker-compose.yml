services:
  ip-pinger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip-pinger
    restart: unless-stopped
    ports:
      - "32001:32001"
    cap_add:
      - NET_RAW
    environment:
      - CONFIG_PATH=/app/config/config.yml
    volumes:
      - /mnt/ip-pinger-data/config:/app/config:rw
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:32001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
