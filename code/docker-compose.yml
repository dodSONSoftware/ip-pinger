# Explicit project name: the default (directory basename "code") collides
# with the sibling sensor-services project, producing orphan-container
# warnings and making "down" targets ambiguous.
name: ip-pinger

services:
  ip-pinger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip-pinger
    restart: unless-stopped
    ports:
      - "32001:32001"
    cap_add:
      - NET_RAW
    environment:
      - CONFIG_PATH=/app/config/config.yml
      # Optional restart secret: enables POST /restart-service (unset or
      # empty = endpoint disabled, 503). Supply the value via a protected
      # local .env file (git-ignored; see .env.example) or the deployment
      # environment —
      # never committed here — e.g. generated with `openssl rand -hex 32`.
      # Present but shorter than 32 bytes fails the container at startup.
      - RESTART_SERVICE_TOKEN=${RESTART_SERVICE_TOKEN:-}
    volumes:
      - /mnt/ip-pinger-data/config:/app/config:rw
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:32001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
