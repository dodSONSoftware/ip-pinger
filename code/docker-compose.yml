# Explicit project name: the default (directory basename "code") collides
# with the sibling sensor-services project, producing orphan-container
# warnings and making "down" targets ambiguous.
name: ip-pinger

services:
  ip-pinger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip-pinger
    restart: unless-stopped
    ports:
      - "32001:32001"
    cap_add:
      - NET_RAW
    environment:
      - CONFIG_PATH=/app/config/config.yml
      # Both secrets share one rule (>= 32 characters of A-Z, a-z, 0-9) and a
      # two-state model: unset/empty/set-but-invalid disables the ability with
      # a startup warning (the container still boots); only a valid value
      # enables it. Supply values via a protected local .env file (git-ignored;
      # see .env.example) or the deployment environment — never committed here
      # — e.g. generated with `openssl rand -hex 32`.
      # Optional restart secret: enables POST /restart-service (unset or
      # invalid = endpoint disabled, 503).
      - RESTART_SERVICE_TOKEN=${RESTART_SERVICE_TOKEN:-}
      # Optional config API secret: enables /read-config, /write-config, and
      # /reload-config via the x-config-token header (unset or invalid = API
      # disabled, 503; valid = 401 without a matching header).
      - IP_PINGER_CONFIG_TOKEN=${IP_PINGER_CONFIG_TOKEN:-}
    volumes:
      - /mnt/ip-pinger-data/config:/app/config:rw
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:32001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
